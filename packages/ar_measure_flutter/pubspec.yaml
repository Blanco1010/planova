name: ar_measure_flutter
description: >-
  AR plugin for Flutter with screen-space hit testing and per-frame camera
  matrices, so you can build aim-a-reticle measuring flows and world-anchored
  overlays on ARCore and ARKit.
version: 0.1.1
repository: https://github.com/Cornelius-Mutisya/ar_measure_flutter
issue_tracker: https://github.com/Cornelius-Mutisya/ar_measure_flutter/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  vector_math: ^2.1.1
  json_annotation: ^4.9.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.uhg0.ar_flutter_plugin_2
        pluginClass: ArFlutterPlugin
      ios:
        pluginClass: ArFlutterPlugin
